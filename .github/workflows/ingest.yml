name: Ingest AMI Data

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to download data from (e.g., v0.1-data)'
        required: false
        type: string
      file_url:
        description: 'Direct download URL for the CSV or ZIP file'
        required: false
        type: string
      dry_run:
        description: 'Dry run (validate only, no DB writes)'
        required: false
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download from release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/incoming
          echo "Downloading from release: ${{ inputs.release_tag }}"
          gh release download "${{ inputs.release_tag }}" --dir data/incoming --repo ${{ github.repository }}
          ls -la data/incoming/
          if ls data/incoming/*.zip 1>/dev/null 2>&1; then
            ZIP_FILE=$(ls data/incoming/*.zip | head -1)
            echo "FILE_PATH=$ZIP_FILE" >> $GITHUB_ENV
            echo "FILE_TYPE=zip" >> $GITHUB_ENV
          elif ls data/incoming/*.csv 1>/dev/null 2>&1; then
            echo "FILE_PATH=data/incoming/" >> $GITHUB_ENV
            echo "FILE_TYPE=dir" >> $GITHUB_ENV
          fi

      - name: Download from URL
        if: ${{ inputs.file_url != '' && inputs.release_tag == '' }}
        run: |
          mkdir -p data/incoming
          curl -L -o data/incoming/download "${{ inputs.file_url }}"
          FILE_TYPE_MIME=$(file --mime-type -b data/incoming/download)
          if [[ "$FILE_TYPE_MIME" == *"zip"* ]]; then
            mv data/incoming/download data/incoming/meterdata.zip
            echo "FILE_PATH=data/incoming/meterdata.zip" >> $GITHUB_ENV
            echo "FILE_TYPE=zip" >> $GITHUB_ENV
          else
            mv data/incoming/download data/incoming/meterdata.csv
            echo "FILE_PATH=data/incoming/meterdata.csv" >> $GITHUB_ENV
            echo "FILE_TYPE=file" >> $GITHUB_ENV
          fi

      - name: Check database connection
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL secret is empty or not set"
            echo "Go to repo Settings > Secrets and variables > Actions"
            echo "Make sure the secret is named exactly DATABASE_URL"
            exit 1
          else
            echo "DATABASE_URL is set (length: ${#DATABASE_URL} chars)"
          fi
          
      - name: Run ingest
        run: |
          ARGS="--${{ env.FILE_TYPE }} ${{ env.FILE_PATH }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: python scripts/ingest_ami.py $ARGS"
          python scripts/ingest_ami.py $ARGS

      - name: Clean up data files
        if: always()
        run: rm -rf data/incoming/*
